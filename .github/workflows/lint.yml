name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.15"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # Master carries ~33 files of pre-existing format drift from before
      # this workflow ever ran; blocking every PR on that backlog would be
      # disproportionate. Scope the check to files the PR actually changes
      # so drift cleans up organically as files are touched.
      - name: Check formatting (PR-changed files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM \
            "origin/${{ github.base_ref }}...HEAD" -- '*.ex' '*.exs' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No Elixir files changed; skipping format check."
            exit 0
          fi
          echo "Checking: $files"
          mix format --check-formatted $files

      # Same reasoning as the format check: master has ~30 pre-existing
      # Credo findings from the period before this workflow ran. Scope the
      # check to .ex/.exs files the PR actually modifies so drift cleans up
      # organically and new issues still block merge.
      - name: Run Credo (PR-changed files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM \
            "origin/${{ github.base_ref }}...HEAD" -- '*.ex' '*.exs' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No Elixir files changed; skipping credo."
            exit 0
          fi
          echo "Running credo on: $files"
          mix credo --files-included "$files"
